# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisories. Vulnerabilities and unsound code fail for any crate in
# the graph; unmaintained crates only when we depend on them directly
# (transitive ones, e.g. ttf-parser via egui and smartstring via Rhai, have no
# maintained replacement upstream yet). Yanked versions are errors.
unsound = "all"
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Project code is MIT OR Apache-2.0 and links only permissive dependencies
# (CONTRIBUTING.md §8). Data files under assets/ are not compiled in and are
# covered by docs/ASSET_LICENSES.md, not by this check.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.9

# Reviewed exceptions, scoped to one crate each:
exceptions = [
    # egui's bundled fonts (Hack, Ubuntu-Light, Noto Emoji, emoji-icon-font):
    # font data, redistributed with its notices.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # Rhai's small-string type; MPL-2.0 is file-level copyleft and we do not
    # modify it ("MPL only if unavoidable and reviewed", docs/RESEARCH.md §8).
    { crate = "smartstring", allow = ["MPL-2.0"] },
]

[licenses.private]
# Workspace crates are `publish = false`; their licence is checked anyway.
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
