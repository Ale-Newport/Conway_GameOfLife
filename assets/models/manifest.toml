# Emergence Lab - 3D model manifest (generated by scratchpad build_assets.py; edit freely)
# Units: 1 world unit = 1 metre. `scale` = uniform factor to apply to the glTF scene root so the
# model reaches its real-world reference size (measured from the rest-pose AABB incl. skinning).
# `forward` = model-space facing axis; glTF convention is +Z. `yaw_offset_deg` rotates the scene root
# about +Y so the model faces +Z. Bevy's Transform::forward() is -Z: add 180 deg if you steer with it.
# animation_set maps our actions (idle, walk, run, eat, attack, death, fly, swim, jump, rest) to clip
# names exactly as stored in the GLB (bevy: Gltf::named_animations[name]). Missing actions are listed
# in `missing_actions` and must use the procedural fallback described in docs/research/assets-3d.md.
# `anim_speed` = playback-speed multipliers when one clip is reused for several actions.
# All animated clips are in-place (no root motion): move the entity, match speed to stride.

schema_version = 1
units = "metre"
up_axis = "+Y"

