# Generated by the pattern verifier (scratchpad tool, not part of the repo);
# see docs/research/pattern-library.md for sources, method and licensing.
# Every numeric field below was MEASURED by simulating the RLE file on an
# unbounded grid under B3/S23, not copied from a reference.
#
# Coordinates: x grows to the right, y grows downwards (RLE convention).
#
# Field reference ([[pattern]] tables):
#   id                 unique slug; the RLE lives at `file`
#   name, category     category = directory under life/
#   kind               still_life | oscillator | spaceship | gun | puffer | rake |
#                      eater | reflector | methuselah | growth | breeder | other
#   description        1-2 sentences, original wording
#   discoverer, year   year omitted when unknown; see facts_source
#   period             0 for still lifes and non-periodic patterns. For guns:
#                      period of the gun core (state inside its own bounding box).
#                      For puffers/rakes: period of the leading part (engine plus
#                      freshly emitted exhaust) measured in a co-moving frame.
#   dx, dy, speed      displacement per period (spaceships, puffers, rakes),
#                      in the orientation of the RLE file
#   width, height      bounding box of the live cells in the file
#   population         INITIAL population (live cells in the file)
#   population_range   [min, max] over one period (oscillators)
#   emits, emits_per_period          guns / rakes
#   stabilizes_at, final_population  methuselahs: first generation from which
#                      the pattern is periodic once free-flying spaceships are
#                      ignored (population-sequence test, refined spatially);
#                      final_population counts escaping gliders too;
#                      dies_at for patterns that vanish
#   growth, growth_period, growth_per_period, linear_from   infinite-growth
#                      patterns (linear_from = first generation from which the
#                      population increases by exactly growth_per_period every
#                      growth_period generations)
#   object_population, demo_glider   eaters/reflectors ship with one incoming
#                      demonstration glider; object_population excludes it
#   expected_behavior  short human-readable summary
#   complexity         1 (tiny classic) .. 5 (large engineered construction)
#   source             where the cell data came from
#   facts_source       where discoverer/year came from
#   license, license_note
#   verified, verification   verifier verdict and measured summary

